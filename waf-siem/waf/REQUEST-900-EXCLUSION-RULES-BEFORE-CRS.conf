# =====================================================================
# Exclusiones ANTES del OWASP CRS  (Hito 3: ajuste de falsos positivos)
# =====================================================================
# Este archivo se monta en el WAF. Después de editarlo:
#     docker compose restart waf
#
# Reglas de oro:
#   1. Excluyan lo mínimo: una regla (id) para un parámetro en una ruta.
#      Nunca desactiven el CRS completo ni una familia entera de reglas.
#   2. Cada exclusión se documenta en el informe: ruta, regla, por qué es
#      un falso positivo y qué riesgo aceptan.
#   3. Usen IDs propios entre 10000 y 10999 (no chocan con el CRS).
#
# Cómo encontrar qué regla excluir: en Kibana abran el evento bloqueado
# (fuente: waf-audit) y lean modsec.transaction.messages.details.ruleId
# y el campo "data" (qué parámetro disparó la regla: "found within").
# El 949110 es el umbral que bloquea: no se excluye. La exclusión va
# sobre la regla que sumó puntos.
#
# Si el falso positivo no es uno de los ejemplos, no lo descomenten.
# Investiguen ese ruleId en el contenedor:
#   docker compose exec waf grep -n "id:942100" -R /etc/modsecurity.d/owasp-crs/rules
# y en https://coreruleset.org/docs/2-how-crs-works/2-3-false-positives-and-tuning/
# La guía del Equipo azul (sección Exclusiones) explica los cuatro tipos.
#
# ---------------------------------------------------------------------
# Tipo 1 (comentado): un campo, una regla, una ruta. El campo
# "descripcion" de reseñas permite texto libre y dispara 942100
# (SQLi por libinjection). Se quita SOLO ese parámetro de SOLO esa
# regla, SOLO en esa ruta. Cambien ruta, id, regla y campo por los
# de su evento. El id 10001 ya lo usa la exclusión de laboratorio.
#
# SecRule REQUEST_URI "@beginsWith /api/resenas" \
#     "id:10010,phase:1,pass,nolog,\
#     ctl:ruleRemoveTargetById=942100;ARGS:descripcion"
#
# Tipo 2 (comentado): una regla entera, solo en una ruta. Una carga
# legítima dispara 920420 porque su Content-Type no está en la lista
# del CRS. No hay un ARGS:campo que aislar. La ruta es exacta (@streq).
#
# SecRule REQUEST_URI "@streq /api/archivos/subir" \
#     "id:10011,phase:1,pass,nolog,\
#     ctl:ruleRemoveById=920420"
#
# Tipo 3: el mismo campo en todas las rutas. Va en RESPONSE-999, no aquí.
# Tipo 4: PUT, PATCH o DELETE legítimos (regla 911100). Se agregan en
# ALLOWED_METHODS del .env, no con una SecRule.
# ---------------------------------------------------------------------

# Sus exclusiones aquí:

# Falso positivo de laboratorio: curl/navegador contra http://127.0.0.1:8080
# (p. ej. HEAD /). La regla 920350 marca REQUEST_HEADERS:Host cuando el valor
# es una IP numérica (data: 127.0.0.1:8080). Se quita solo ese header de solo
# esa regla, y solo si el Host es loopback.
# Riesgo aceptado: un cliente que llegue con Host 127.0.0.1 no es evaluado
# por 920350. El resto del CRS sigue activo, también para otras IP en Host.
SecRule REQUEST_HEADERS:Host "@rx ^127\.0\.0\.1(?::\d+)?$" \
    "id:10001,phase:1,pass,nolog,\
    ctl:ruleRemoveTargetById=920350;REQUEST_HEADERS:Host"

# Falso positivo H3 (2026-11-17 07:51): GET /rest/user/whoami recibe 403.
# La regla 932260 (RCE: comando Unix directo) ve "whoami" dentro de
# REQUEST_FILENAME. Es la ruta de la API que la SPA llama en cada carga para
# saber quién es el usuario logueado: no es un comando, es el nombre del endpoint.
# Tipo 1/2 reducido: se quita SOLO el target REQUEST_FILENAME de SOLO la 932260,
# SOLO cuando la ruta es exactamente /rest/user/whoami (@streq, sin comodines).
# Riesgo aceptado: en esa ruta exacta la 932260 no mira el nombre del archivo.
# Los parámetros (ARGS), cookies y cabeceras de esa ruta siguen evaluados por la
# 932260, y el resto del CRS sigue activo.
SecRule REQUEST_FILENAME "@streq /rest/user/whoami" \
    "id:10002,phase:1,pass,nolog,\
    ctl:ruleRemoveTargetById=932260;REQUEST_FILENAME"

# >>> H3-B (exclusiones de la ampliación; scripts/alternar-exclusiones.sh las apaga y prende)
# Falso positivo H3-B (1): POST /socket.io/?EIO=4&transport=polling recibe 403.
# Las notificaciones en tiempo real de Juice Shop (retos resueltos, avisos) usan
# socket.io. Antes de pasar a WebSocket, el cliente del navegador manda sus mensajes
# por POST con Content-Type "text/plain;charset=UTF-8", y text/plain no está en la
# lista de tipos permitidos del CRS: la regla 920420 (tipo de contenido no permitido)
# bloquea la petición.
# Tipo 2 reducido: se quita SOLO la 920420, SOLO en la ruta exacta /socket.io/ y
# SOLO si el Content-Type es text/plain (con o sin charset=utf-8). Cualquier otro
# tipo de contenido en esa ruta sigue evaluado por la 920420.
# Riesgo aceptado: en /socket.io/ se acepta text/plain. El cuerpo sigue pasando por
# el resto del CRS (inyección de comandos, SQLi, XSS).
SecRule REQUEST_FILENAME "@streq /socket.io/" \
    "id:10003,phase:1,pass,nolog,chain"
    SecRule REQUEST_HEADERS:Content-Type "@rx ^text/plain(?:;\s*charset=utf-8)?$" \
        "t:none,t:lowercase,ctl:ruleRemoveById=920420"

# Falso positivo H3-B (2): PUT /rest/products/:id/reviews con el texto
# "Muy rico; echo de menos la presentación en vidrio" recibe 403.
# La regla 932235 (inyección de comandos Unix) ve "; echo " y lo toma por el comando
# echo. En español "echo de menos" es una frase común. La reseña se guarda en MarsDB
# (D2) y se muestra como texto: nunca llega a una shell.
# Tipo 1: se quita SOLO el campo ARGS:json.message de SOLO la 932235, SOLO en las rutas
# de reseñas (crear: /rest/products/<id>/reviews, editar: /rest/products/reviews).
# Riesgo aceptado: en el texto de la reseña la 932235 no revisa comandos. Las demás
# reglas 932* (932130, 932250, 932260...) y las de SQLi/XSS siguen evaluando ese campo,
# y DET-05 sigue viendo los intentos de inyección de comandos en la búsqueda.
SecRule REQUEST_FILENAME "@rx ^/rest/products/(?:[0-9]+/)?reviews$" \
    "id:10004,phase:1,pass,nolog,\
    ctl:ruleRemoveTargetById=932235;ARGS:json.message"
# <<< H3-B
